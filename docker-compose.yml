services:
  postgres:
    image: postgres:16-alpine
    container_name: nextventures-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nextventures
      POSTGRES_PASSWORD: nextventures
      POSTGRES_DB: nextventures
    volumes:
      - nextventures_pgdata:/var/lib/postgresql/data

volumes:
  nextventures_pgdata:
